name: CI

# 门禁内容：
#   lint  —— ruff check（规则集固定在 pyproject [tool.ruff.lint]）+ ruff format --check
#            format 检查是新增门禁：此前只有 ruff check 在把关，格式漂移累积到 51 个文件
#            （已由 PR #18 一次性对齐），加这道门禁防止再次漂移。
#   test  —— pytest tests/（真实库集成测试 tests/test_real_*.py 需 GOVIO_REAL_DB=1，默认 skip）
#
# 依赖来源：uv.lock 已入仓（以 PyPI 为基准，清华等镜像有同步延迟故不当默认源），CI 用
# `uv sync --group dev --locked` 严格按 lock 安装，不重新解析 —— 上游发版不会让 CI 莫名变红；
# 若改了 pyproject 依赖却没跑 `uv lock` 并提交，--locked 会直接失败（这是故意的）。
# 依赖上限仍然是第一道防线（例如 datacompy<1.0：1.x 移除了 datacompy.core，会让
# core/comparator.py 直接 ImportError）；ruff 锁 <0.16 是因为 format 当门禁必须锁 formatter 版本。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装 uv
        run: python -m pip install --upgrade uv

      - name: 安装依赖
        # --locked：严格按 uv.lock 安装，且断言 lock 与 pyproject 一致（不一致直接失败）
        run: uv sync --group dev --locked

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 安装 uv
        run: python -m pip install --upgrade uv

      - name: 安装依赖
        run: uv sync --group dev --locked

      - name: pytest
        run: uv run --no-sync python -m pytest tests/ -q
